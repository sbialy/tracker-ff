name: Build Tracker CE Firmware

on:
  push:
    branches: [ main, 'release-*' ]
    tags: [ 'tracker-ff-v*' ]
  pull_request:
    branches: [ main, 'release-*' ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    env:
      # Tracker+ and Tracker Mini (IMX) are built only on a v* tag push and on a manual run (workflow_dispatch, the check before a release).
      # Branch pushes and pull requests build the original (MK66) only.
      IMX_BUILD: ${{ (startsWith(github.ref, 'refs/tags/tracker-ff-v') || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for AI bot Co-authored-by trailers
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git log --format="%B" "$BASE_SHA..$HEAD_SHA" | grep -iE "^Co-authored-by:.*(copilot|claude|cursor|anthropic|openai|gemini|windsurf|aider|coderabbit|devin|\[bot\])"; then
            echo "::error::Please remove AI assistant 'Co-authored-by:' trailers from your commit messages so the repository Contributors list only credits human contributors."
            exit 1
          fi

      - name: Cache GNU Arm Embedded Toolchain 10.3-2021.10
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: agt/10.3
          key: arm-none-eabi-10.3-2021.10-linux-x86_64

      - name: Install GNU Arm Embedded Toolchain 10.3-2021.10
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2 make python3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
          mkdir -p agt/10.3
          tar -xjf gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2 -C agt/10.3 --strip-components=1
          rm gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2

      - name: Check version configuration
        run: make version

      # Every plugin module comes from a module repository pinned in engines/external.lock.json: tracker-engines-os and tracker-effects-os
      # (public, fetched over https without a token) and tracker-engines and tracker-effects (private: PHZ, PLK, ALCO, Console, Tube, Glue). With a secret
      # PRIVATE_RELEASES_TOKEN (a token that can read the private releases) the private sets are fetched and checked too. Without it
      # (forks, pull requests from forks) only the public sets are checked. A public set that cannot be fetched (its release is not
      # published yet) skips the check with a note.
      - name: Fetch the pinned plugin modules
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASES_TOKEN }}
        run: |
          vis=public
          [ -n "$GH_TOKEN" ] && vis=all
          args=""
          [ "$vis" = public ] && args="--visibility public"
          if python3 -I engines/external.py fetch "$RUNNER_TEMP/external" $args; then
            echo "EXTERNAL_DIR=$RUNNER_TEMP/external" >> "$GITHUB_ENV"
            echo "EXTERNAL_VISIBILITY=$vis" >> "$GITHUB_ENV"
          else
            echo "the pinned module releases are not available, the modules are not checked"
          fi

      - name: Check the plugin modules against the public identity (verify-external)
        run: engines/ci_external.sh

      # The shipped MK66 image is built with GCC 12.3 (Arm GNU Toolchain 12.3.rel1), so the frame ratchet (synth-open/tools/stack_ratchet.py) runs on it:
      # a new frame of 512 B or more, a new VLA, a grown frame or an audio chain frame over the hard cap against synth-open/tools/stack_baseline_gcc12.txt
      # fails the build. The release flavour builds here with the 12.3 compiler and no second compiler step may reuse its objects (make does not track the
      # compiler), so the build dirs of that flavour are wiped right after. OUT_DIR=build/gate12 keeps the gate image out of the build/*.ptf upload glob.
      - name: Cache Arm GNU Toolchain 12.3.rel1
        id: cache-toolchain-12
        uses: actions/cache@v4
        with:
          path: agt/12.3.rel1
          key: arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi

      - name: Install Arm GNU Toolchain 12.3.rel1
        if: steps.cache-toolchain-12.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils make python3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/12.3.rel1/binrel/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi.tar.xz
          mkdir -p agt/12.3.rel1
          tar -xJf arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi.tar.xz -C agt/12.3.rel1 --strip-components=1
          rm arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi.tar.xz

      - name: Stack ratchet on GCC 12.3 (the shipped compiler)
        run: make stack-ratchet-release TOOLCHAIN="$PWD/agt/12.3.rel1/bin/arm-none-eabi-" OUT_DIR="$PWD/build/gate12" BUILD_TAG="$(git rev-parse --short=7 HEAD)"

      - name: Wipe the 12.3 release objects before the 10.3 build
        run: rm -rf core/build-MK66-ORIGINAL-SYNTHOPEN-* platforms/mk66/build-trim

      # Static worst case stack gate (synth-open/tools/stack/stack_margin.py): main loop + audio chain + every nested interrupt against the real stack
      # room of the linked release image, in both USB modes, floor 512 B. Fails too when the interrupt census (stack_isr_levels.txt), the dynamic frame
      # bounds (stack_vla_bounds.txt) or the STACK_MARGIN check no longer match the image. The plugin depths are the committed 1.3.0 values
      # (stack_plugin_depths.txt, the plugin ELFs are not in this repository).
      # It builds the release flavour (make original-release: USB_AUDIO=1 and -DFEATURE_EXT_HOOKS, the recipe of the README and of every device round)
      # of the original on the pinned 10.3 compiler, the second compiler: the synth-open objects build with -Werror, so a new warning there (also the
      # C++20 -Wvolatile hits only 10.3 reports) fails this build. There is no 10.3 stack ratchet: the shipped image is built with GCC 12.3 and the
      # frame ratchet runs on 12.3 in the step above. Changes nothing in the image.
      # OUT_DIR moves only what the gate copies out (its release .ptf, BUILD.txt, the build log), the .su files, map and axf the gate reads stay
      # in core/build-* and platforms/mk66/build*. Without it the gate image lands in build/ and the upload of build/*.ptf below ships it
      # as PolyendTracker_FF_<A.B.C>.ptf, a release-looking name for a gate-only image on the pinned 10.3 compiler.
      - name: Build the release original with -Werror and run the static worst case stack gate
        run: make stack-margin-release OUT_DIR="$PWD/build/gate" BUILD_TAG="$(git rev-parse --short=7 HEAD)"

      # Lint delta: array-bounds, null-dereference, overflow and file manager / plugin host -Wconversion warnings, and a short list of cppcheck
      # ids, on lines added since the merge-base with the upstream polyend/tracker-ce main only (origin here is this fork, whose main has
      # other history, so the base is fetched explicitly). Reviewed false positives: synth-open/tools/lint_delta_allow.txt.
      - name: Lint delta against upstream main
        run: |
          sudo apt-get install -y cppcheck
          git fetch --no-tags https://github.com/polyend/tracker-ce main:refs/remotes/upstream/main
          make lint-delta-release LINT_BASE=upstream/main

      - name: Build Original Tracker firmware
        run: |
          set -o pipefail
          POSTFIX_ARGS=()
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            POSTFIX_ARGS=("ORIGINAL_POSTFIX=CE_${SHORT_SHA}")
          fi
          make original "${POSTFIX_ARGS[@]}" 2>&1 | tee build_output.log

      # The check before a release: Tracker+ and Tracker Mini must still compile (make plus, make mini). Only on a tracker-ff-v* tag push and on a manual
      # workflow_dispatch run, never on a branch push or a pull request.
      - name: Build Tracker+ and Tracker Mini firmware (tags and manual runs only)
        if: env.IMX_BUILD == 'true'
        run: |
          set -o pipefail
          POSTFIX_ARGS=()
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            POSTFIX_ARGS=("PLUS_POSTFIX=FF_${SHORT_SHA}" "MINI_POSTFIX=FF_${SHORT_SHA}")
          fi
          make plus mini "${POSTFIX_ARGS[@]}" 2>&1 | tee -a build_output.log

      - name: Build reference .ptfx Sample Editor plugins
        run: |
          make ptfx
          printf "Copy the Effects/ folder to the root directory of your Polyend Tracker microSD card.\n" > editor-fx-sdk/build/README.txt

      - name: Publish Firmware Size & Memory Summary
        if: always()
        run: |
          {
            echo "### Generated \`.ptf\` Firmware Files"
            echo "\`\`\`text"
            ls -lh build/*.ptf || true
            echo "\`\`\`"
            echo ""
            echo "### Generated \`.ptfx\` Sample Editor Effects (\`/Effects\`)"
            echo "\`\`\`text"
            ls -lh editor-fx-sdk/build/Effects/*.ptfx || true
            echo "\`\`\`"
            echo ""
            if [ "$IMX_BUILD" = true ]; then
              echo "### Linker Memory Usage (Original Tracker, Tracker+, Tracker Mini)"
            else
              echo "### Linker Memory Usage (Original Tracker)"
            fi
            echo "\`\`\`text"
            grep -E "^ Building |=== Building|Memory region|FLASH:|RAM:|EXTERNAL_RAM:|QSPI_FLASH:|SRAM_DTC:|SRAM_ITC:|SRAM_OC:" build_output.log || true
            echo "\`\`\`"
          } > pr_summary.md

          {
            echo "## Polyend Tracker CE - Firmware Build & Memory Summary"
            echo ""
            cat pr_summary.md
            echo ""
            echo "> **Downloads (Bottom of Summary Page)**:"
            if [ "$IMX_BUILD" = true ]; then
              echo "> * **\`polyend-tracker-ce-firmware\`**: Ready-to-flash \`.ptf\` firmware files for **Original Tracker**, **Tracker+**, and **Tracker Mini**."
            else
              echo "> * **\`polyend-tracker-ce-firmware\`**: Ready-to-flash \`.ptf\` firmware file for the **Original Tracker** (Tracker+ and Tracker Mini are built on tags and manual runs only)."
            fi
            echo "> * **\`polyend-tracker-ce-effects\`**: Unzip and copy the included **\`Effects/\`** folder directly to the root of your Tracker's microSD card."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR_TARGET_NUMBER=${{ github.event.pull_request.number }}"
            echo "PR_SUMMARY_B64=$(base64 -w 0 pr_summary.md)"
          fi

      - name: Upload Firmware Artifacts (.ptf)
        uses: actions/upload-artifact@v4
        with:
          name: polyend-tracker-ce-firmware
          path: build/*.ptf

      - name: Upload Sample Editor Effects Artifact (Effects/*.ptfx)
        uses: actions/upload-artifact@v4
        with:
          name: polyend-tracker-ce-effects
          path: editor-fx-sdk/build/

      - name: Post Firmware Download Links to PR (Same-Repo PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const prNumber = context.payload.pull_request.number;
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const summaryDetails = fs.existsSync('pr_summary.md')
              ? fs.readFileSync('pr_summary.md', 'utf8').trim()
              : '';

            const fwUrl = `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/polyend-tracker-ce-firmware.zip`;
            const fxUrl = `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/polyend-tracker-ce-effects.zip`;
            const marker = '<!-- polyend-tracker-ce-pr-firmware -->';

            const body = [
              marker,
              '### Polyend Tracker CE Test Firmware & Sample Editor Effects',
              '',
              'This pull request passed all build checks. You can download and test the built firmware for the **Original Tracker** (`Build: ' + shortSha + '`) and the `.ptfx` Sample Editor plugins directly using the links below (no GitHub account required). Tracker+ and Tracker Mini are not built for pull requests, they are checked before a release:',
              '',
              `* **[Download Firmware (.zip)](${fwUrl})**`,
              `* **[Download Sample Editor Effects (.zip)](${fxUrl})**`,
              '',
              '<details>',
              '<summary><b>How to Install & Flash on Your Tracker</b></summary>',
              '',
              '### 1. Flashing the Firmware (`.ptf`)',
              `1. Download and unzip **[polyend-tracker-ce-firmware.zip](${fwUrl})**.`,
              `2. Copy the \`PolyendTracker_CE_${shortSha}.ptf\` file (for the **Original Polyend Tracker**) to the **\`/Firmware/\`** folder on your Tracker\'s microSD card.`,
              '3. Insert the microSD card into your Tracker, navigate to **Config → Firmware → Firmware update**, select the `.ptf` file, and confirm.',
              `4. Once rebooted, you can verify you are running this PR build under **Config → Firmware** (\`Build: ${shortSha}\`).`,
              '',
              '### 2. Installing Sample Editor Effects (`.ptfx`)',
              `1. Download and unzip **[polyend-tracker-ce-effects.zip](${fxUrl})**.`,
              '2. Copy the **`Effects/`** folder to the root directory of your Tracker\'s microSD card so your `.ptfx` plugins are located at **`/Effects/*.ptfx`**.',
              '',
              '### 3. Emergency Recovery (Just in Case)',
              'The Tracker\'s bootloader is hardware-isolated from the firmware. If a test build ever fails to boot:',
              '1. Place a known-good, stable `.ptf` firmware file inside the **`/Firmware/`** folder on your microSD card (ideally as the only `.ptf` file in that folder).',
              '2. Insert the microSD card and power on your Tracker.',
              '3. Use a paperclip or SIM-eject pin to press the **recessed hardware Reset / Emergency Bootloader pinhole button** (on the bottom of the Original Tracker). The bootloader will automatically flash the `.ptf` file from `/Firmware/`.',
              '',
              '</details>',
              '',
              '<details>',
              '<summary><b>Firmware File Sizes & Linker Memory Summary</b></summary>',
              '',
              summaryDetails,
              '',
              '</details>'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

      - name: Package .ptfx Effects for GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd editor-fx-sdk/build
          zip -r ../../build/PolyendTracker_CE_Effects.zip Effects README.txt

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Polyend Tracker CE ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/*.ptf
            build/PolyendTracker_CE_Effects.zip
